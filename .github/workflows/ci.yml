name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for tracked environment files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\.[^e])$'; then
            echo "Tracked environment file detected."
            exit 1
          fi

      - name: Validate required assessment structure
        shell: bash
        run: |
          test -f README.md
          test -f .gitignore
          test -f docker-compose.yml
          test -f backend/package.json
          test -f ai/requirements.txt
          test -f frontend/package.json

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: repository-hygiene
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Unit tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: repository-hygiene
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  ai:
    name: Python AI agent
    runs-on: ubuntu-latest
    needs: repository-hygiene
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: ai
        run: python -m pip install -r requirements.txt
      - name: Compile check
        working-directory: ai
        run: python -m compileall -q app
      - name: Tests
        working-directory: ai
        env:
          PYTHONPATH: .
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q

  docker:
    name: Docker topology
    runs-on: ubuntu-latest
    needs:
      - repository-hygiene
      - backend
      - frontend
      - ai
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build service images
        run: docker compose build
